[project]
name = "self-hpo-baseline"
version = "0.1.0"
requires-python = ">=3.12"
description = "Fixed-schedule Self-HPO coding baseline"
dependencies = ["mini-swe-agent==2.2.6+selfhpo", "swebench==4.1.0", "openai==2.54.0", "pyyaml==6.0.3", "e2b==2.62.0"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["baseline"]

[tool.pytest.ini_options]
testpaths = ["tests/baseline"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["mini-swe-agent", "slime", "baseline/grading_spec.py", "baseline/grading_report.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
