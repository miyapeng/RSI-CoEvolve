# Evaluation-only. Reuses the unchanged official Claude Code + browser + VLM harness.
benchmark: vision2web
model: claude-sonnet-4-5-20250929
seed: 42
eval_repetitions: 1
official:
  repo: ../references/Vision2Web
  python: python
  dataset_dir: ${VISION2WEB_DATA}
  task_ids: [webpage/abc]
  framework: claude_code
  transport: tencent_e2b
  sandbox_image: ${VISION2WEB_SANDBOX_IMAGE}  # TCR URI with @sha256, not a prototype image
  timeout: 1800
  episode_timeout: 3600
  policy_api_key_env: ANTHROPIC_API_KEY
  policy_base_url: null
  functional_model: claude-sonnet-4-5-20250929
  functional_api_key_env: ANTHROPIC_API_KEY
  functional_base_url: null
  visual_model: gemini-3-pro-preview
  visual_api_key_env: VISION2WEB_VISUAL_API_KEY
  visual_base_url: null
  tencent:
    key_env: E2B_API_KEY
    domain: ap-beijing.tencentags.com
    template: code-agent-cfs2-new
    connection: direct
    proxy_env: http_proxy
    cpu: 2
    memory: 8Gi
    sandbox_timeout: 3600
    command_timeout: 1800
    request_timeout: 45
