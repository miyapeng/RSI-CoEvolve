# CPU orchestration only. Browser and agent CLI dependencies live in the official image.
name: vision2web
channels: [defaults]
variables:
  PYTHONNOUSERSITE: "1"
dependencies:
  - python=3.12
  - pip
  - pip:
      - click==8.5.0
      - pyyaml==6.0.3
      - openai==3.31.0
      - playwright==1.60.0
      - Pillow==12.3.0
      - e2b==2.62.0
# No editable upstream package is required: the worker imports the verified checkout.
